name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Set the CWS_* repository secrets to also ship each tag to the Chrome Web Store (see README)
    env:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build extension
        run: pnpm build

      - name: Create extension zip
        run: |
          cd dist
          zip -r ../setflow-extension.zip .

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_RELEASE.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: setflow-extension.zip
          body: ${{ steps.git-cliff.outputs.content }}

      - name: Publish to Chrome Web Store
        if: env.CWS_EXTENSION_ID != ''
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@4 --source setflow-extension.zip
